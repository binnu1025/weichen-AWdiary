<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>安麗日記</title>
    <meta name="application-name" content="安麗日記">
    <meta name="apple-mobile-web-app-title" content="安麗日記">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#566b57">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
    <link rel="apple-touch-icon" href="./apple-touch-icon.png">
    <link rel="stylesheet" href="./styles.css?v=20261022-4">
  </head>
  <body>
    <main class="shell">
      <header class="head">
        <h1>安麗日記</h1>
        <p class="sub" id="who">尚未登入</p>
      </header>

      <section class="card" id="startCard">
        <p class="note">
          用你自己的 Google 帳號登入。資料會存在
          <b>你自己的雲端硬碟</b>裡，別人看不到。
        </p>
        <button class="btn primary" id="signInBtn">用 Google 登入</button>
      </section>

      <section class="card" id="sheetCard" hidden>
        <div class="row">
          <span id="sheetState">尚未建立資料表</span>
          <a class="link" id="sheetLink" target="_blank" rel="noopener" hidden>開啟試算表</a>
        </div>
        <label class="field" id="nameField">
          <span>安麗日記名稱</span>
          <input id="diaryName" type="text" maxlength="60" value="我的安麗日記" placeholder="例如：緯宸安麗日記">
        </label>
        <div class="actions">
          <button class="btn primary" id="createBtn">建立全新的安麗日記</button>
          <button class="btn" id="reloadBtn" hidden>重新讀取</button>
          <button class="btn" id="addBtn" hidden>加一筆測試資料</button>
        </div>
      </section>

      <section id="listBox"></section>

      <p class="status" id="status"></p>
    </main>

    <dialog class="modal" id="personDialog">
      <form class="modal-panel" id="personForm" method="dialog">
        <div class="modal-head">
          <div>
            <p class="modal-kicker">新增人員</p>
            <h2>輸入姓名</h2>
          </div>
          <button class="icon-btn" id="personCloseBtn" type="button" aria-label="關閉">&times;</button>
        </div>
        <label class="field modal-field">
          <span>姓名</span>
          <input id="personName" type="text" maxlength="40" autocomplete="name" placeholder="請輸入姓名">
        </label>
        <p class="field-error" id="personNameError" hidden>請輸入姓名</p>
        <div class="modal-actions">
          <button class="btn" id="personCancelBtn" type="button">取消</button>
          <button class="btn primary" type="submit">確認新增</button>
        </div>
      </form>
    </dialog>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="./app.js?v=20261022-4"></script>
  </body>
</html>
